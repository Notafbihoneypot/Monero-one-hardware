name: Build Monero One Hardware APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout integration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone Monero One
        run: git clone --recurse-submodules https://github.com/bwgh0/MoneroOne.Android.git MoneroOne

      - name: Apply Keystone integration
        run: python3 tools/moneroone-keystone/patch.py MoneroOne

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: MoneroOne
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and checksum
        run: |
          cp MoneroOne/app/build/outputs/apk/debug/app-debug.apk MoneroOne-Hardware-Keystone-debug.apk
          sha256sum MoneroOne-Hardware-Keystone-debug.apk | tee MoneroOne-Hardware-Keystone-debug.apk.sha256

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneroOne-Hardware-Keystone-debug
          path: |
            MoneroOne-Hardware-Keystone-debug.apk
            MoneroOne-Hardware-Keystone-debug.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="keystone-test-v0.7"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Monero One Hardware - Keystone test v0.7" \
          Keystone test v0.7: aligns the final Monero offline-signing step with Feather/Keystone. After Keystone signs, Monero One now explicitly scans the signed xmr-txsigned QR from Keystone's Done screen, confirms receipt, and only broadcasts after the user presses Broadcast / Send XMR. It also adds clearer instructions not to press Done on Keystone until Monero One has captured the signed QR. Includes v0.6 key-image/trusted-daemon and CameraX fixes, v0.5 QR flicker fix, v0.4 restore-height override, and earlier pairing/sync fixes. Experimental debug build; use only a tiny test amount until the full round-trip is validated.
              --prerelease
          fi
          gh release upload "$TAG" \
            MoneroOne-Hardware-Keystone-debug.apk \
            MoneroOne-Hardware-Keystone-debug.apk.sha256 \
            --clobber
